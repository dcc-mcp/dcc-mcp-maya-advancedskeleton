tools:
  - name: inspect_advancedskeleton
    description: Inspect AdvancedSkeleton availability, installed FitSkeleton templates, package version, and current Maya scene state.
    source_file: scripts/inspect_advancedskeleton.py
    input_schema:
      type: object
      additionalProperties: false
      properties:
        verbose:
          type: boolean
          default: false
          description: Include the resolved local AdvancedSkeleton MEL path.
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [import_fit_skeleton, create_fit_skeleton]
      on-failure: []

  - name: import_fit_skeleton
    description: Import an installed AdvancedSkeleton body or limb FitSkeleton template without opening file dialogs.
    source_file: scripts/import_fit_skeleton.py
    input_schema:
      type: object
      additionalProperties: false
      required: [template_name]
      properties:
        template_name:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Installed template filename or stem, such as biped.ma or biped.
        kind:
          type: string
          enum: [body, limb]
          default: body
        replace_existing:
          type: boolean
          default: false
          description: Delete the existing FitSkeleton before importing. Refused when a built rig exists.
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [configure_fit_joint, build_advancedskeleton]
      on-failure: [inspect_advancedskeleton]

  - name: create_fit_skeleton
    description: Create a custom AdvancedSkeleton FitSkeleton from ordered joint names, parents, positions, labels, and supported attributes.
    source_file: scripts/create_fit_skeleton.py
    input_schema:
      type: object
      additionalProperties: false
      required: [joints]
      properties:
        joints:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, position, label]
            properties:
              name:
                type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
              parent:
                type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                description: Parent joint, which must appear earlier in the array. Omit for a FitSkeleton child.
              position:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: number}
                description: World-space XYZ position.
              label:
                type: string
                pattern: "^[A-Za-z0-9_-]{1,64}$"
                description: AdvancedSkeleton IK label, such as Root, Shoulder, Hand, Chest, or a custom label.
              attributes:
                $ref: "#/$defs/attributeConfigs"
        replace_existing:
          type: boolean
          default: false
          description: Delete the existing FitSkeleton first. Refused when a built rig exists.
      $defs:
        attributeConfigs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                enum: [twist/bendy, inbetween, global, aim, wheel, rollingBall, freeOrient, worldOrient, flipOrient, noMirror, noFlip, noControl, noSkin, ikLocal, hipSwinger, follow, ikFollow, aimAt, rootOptions, cog, segScaleComp, childOfPart, control, orientConstraint, footPivots]
              target:
                type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                description: Required for follow, ikFollow, aimAt, and orientConstraint.
              values:
                type: object
                additionalProperties: true
                description: Scalar values for attributes created by the selected AdvancedSkeleton attribute type.
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [configure_fit_joint, build_advancedskeleton]
      on-failure: [inspect_advancedskeleton]

  - name: configure_fit_joint
    description: Set a FitSkeleton joint label and add supported AdvancedSkeleton attributes such as world orientation, follow, twist/bendy, or noControl.
    source_file: scripts/configure_fit_joint.py
    input_schema:
      type: object
      additionalProperties: false
      required: [joint]
      properties:
        joint:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        label:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        attributes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                enum: [twist/bendy, inbetween, global, aim, wheel, rollingBall, freeOrient, worldOrient, flipOrient, noMirror, noFlip, noControl, noSkin, ikLocal, hipSwinger, follow, ikFollow, aimAt, rootOptions, cog, segScaleComp, childOfPart, control, orientConstraint, footPivots]
              target:
                type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
              values:
                type: object
                additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [build_advancedskeleton]
      on-failure: [inspect_advancedskeleton]

  - name: build_advancedskeleton
    description: Build AdvancedSkeleton from FitSkeleton, or rebuild the existing rig after FitSkeleton changes.
    source_file: scripts/build_advancedskeleton.py
    input_schema:
      type: object
      additionalProperties: false
      properties:
        keep_all:
          type: boolean
          default: true
          description: Preserve supported rig customizations during rebuild.
        set_units_to_centimeters:
          type: boolean
          default: true
          description: Switch Maya linear units to centimeters when required by AdvancedSkeleton.
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [inspect_advancedskeleton]
      on-failure: [inspect_advancedskeleton]
