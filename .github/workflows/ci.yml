name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: ["==0.20.0", ">=0.20.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Keep the pre-0.16 rules; migration needs a py37 target and per-rule review.
      - run: pip install "dcc-mcp-core${{ matrix.core }}" "ruff==0.15.22"
      - run: ruff check skill tests
      - run: ruff format --check skill tests
      - run: python -m unittest discover -s tests -v
      - run: python -c "from dcc_mcp_core import validate_skill; report=validate_skill('skill/maya-advancedskeleton'); print(report); raise SystemExit(1 if report.has_errors else 0)"
